<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Client Profile Preview</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
body { background: #0f0f1f; color: #fff; width: 390px; min-height: 844px; overflow-x: hidden; }

.nav-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 20px; border-bottom: 1px solid #ffffff12;
}
.nav-title { font-size: 17px; font-weight: 600; color: #fff; }
.nav-btn { font-size: 16px; color: #fff; }

.screen { padding: 20px 20px 100px; display: flex; flex-direction: column; gap: 24px; }

.profile-header { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 8px; }
.avatar {
  width: 288px; height: 288px; border-radius: 144px;
  background: linear-gradient(135deg, #004aad, #cb6ce6);
  display: flex; align-items: center; justify-content: center;
  font-size: 108px; font-weight: 700; color: #fff;
}
.profile-name { font-size: 22px; font-weight: 700; color: #fff; }
.profile-email { font-size: 14px; color: rgba(255,255,255,0.45); margin-top: -4px; }

.settings {
  border-top: 1px solid #ffffff18;
  padding-top: 24px;
  display: flex; flex-direction: column; gap: 20px;
  margin: 0 16px;
}
.settings-title {
  font-size: 18px; font-weight: 700;
  color: rgba(255,255,255,0.6);
  text-transform: uppercase; letter-spacing: 1px;
}
.sign-out-btn {
  background: rgba(229,57,53,0.12);
  border: 1.5px solid #e53935;
  border-radius: 14px;
  padding: 18px;
  text-align: center;
  font-size: 18px; font-weight: 700; color: #e53935;
  cursor: pointer;
}

.tab-bar {
  position: fixed; bottom: 0; left: 0; right: 0; width: 390px;
  background: #0f0f1f; border-top: 1px solid rgba(255,255,255,0.08);
  display: flex; padding: 8px 0 24px;
}
.tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: rgba(255,255,255,0.4); }
.tab-item.active { color: #cb6ce6; }
.tab-icon { font-size: 20px; }
</style>
</head>
<body>

<div class="nav-header">
  <div style="width:60px"></div>
  <div class="nav-title">Profile</div>
  <div class="nav-btn">Edit</div>
</div>

<div class="screen">
  <div class="profile-header">
    <div class="avatar">O</div>
    <div class="profile-name">Ori Katash</div>
    <div class="profile-email">orikatash8@gmail.com</div>
  </div>

  <div class="settings">
    <div class="settings-title">Settings</div>
    <div class="sign-out-btn">Sign Out</div>
  </div>
</div>

<div class="tab-bar">
  <div class="tab-item"><span class="tab-icon">🔍</span><span>Search</span></div>
  <div class="tab-item"><span class="tab-icon">🏠</span><span>Home</span></div>
  <div class="tab-item active"><span class="tab-icon">👤</span><span>Profile</span></div>
  <div class="tab-item"><span class="tab-icon">↔️</span><span>Switch</span></div>
</div>

</body>
</html>
