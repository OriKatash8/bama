<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAMA – חוזרים לאפליקציה</title>
<!-- Grow's successUrl for a fee payment link (served at /pay-return). It is a
     courtesy page, not a receipt: it reads nothing from its address, sends nothing
     anywhere and cannot mark anything paid. Only Make's confirmation to
     paymentLinkConfirm settles a fee. -->
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#5f6368;--btn:#004aad;--btn-fg:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#121316;--fg:#e8e9ec;--muted:#a0a4ab;--btn:#8ab4ff;--btn-fg:#0b1a33}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Heebo",Arial,sans-serif}
.wrap{max-width:440px;margin:0 auto;padding:40px 20px 56px;text-align:center}
.logo{display:block;margin:0 auto 28px;height:44px;width:auto}
h1{font-size:22px;line-height:1.3;margin:0 0 6px}
.en{color:var(--muted);font-size:15px;margin:0 0 4px}
.lead{margin:0 0 24px;color:var(--muted)}
.open{display:block;width:100%;padding:15px 18px;border-radius:14px;background:var(--btn);color:var(--btn-fg);font-weight:700;font-size:17px;text-decoration:none}
.open small{display:block;font-weight:400;font-size:13px;opacity:.9}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="/logo.webp" alt="BAMA" width="176" height="44">
  <h1>חוזרים לאפליקציה…</h1>
  <p class="en" dir="ltr">Taking you back to the app…</p>
  <p class="lead">אם התשלום הושלם, הוא יתעדכן תוך כמה דקות.</p>
  <p class="lead" dir="ltr">If your payment went through, it will show up within a few minutes.</p>
  <!-- A real link the user can TAP: some browsers refuse a custom-scheme navigation
       that is not a user gesture (see c.html), so the automatic attempt below is only
       a convenience and this button is the dependable way back. -->
  <a class="open" href="bama://settings/payment">חזרה לאפליקציה<small dir="ltr">Back to the app</small></a>
</div>
<script>
/* Inside the payment browser session (iOS ASWebAuthenticationSession, Android Custom
   Tabs) this redirect is what closes the sheet and returns to the app. Elsewhere it may
   be ignored, which is why the button above exists. Fixed destination: no input is used. */
try { location.replace('bama://settings/payment'); } catch (e) {}
</script>
</body>
</html>
